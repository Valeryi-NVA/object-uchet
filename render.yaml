services:
  - type: web
    name: stroygroup
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: AUTH_SECRET
        generateValue: true
    disk:
      name: stroygroup-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
