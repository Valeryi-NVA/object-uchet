services:
  - type: web
    name: object-uchet
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: DATABASE_URL
        fromDatabase:
          name: object-uchet-db
          property: connectionString

databases:
  - name: object-uchet-db
    plan: free
