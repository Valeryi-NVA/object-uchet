services:
  - type: web
    name: stroygroup
    runtime: node
    buildCommand: npm install
    startCommand: npm run db:init && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: object-uchet-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
    disk:
      name: stroygroup-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
