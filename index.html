<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>СтройГрупп — управление фирмой</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#fff; --text:#12161f; --muted:#6b7280;
    --accent:#2563eb; --accent-soft:#e8efff;
    --border:#e3e7ee; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,'Inter',sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; line-height:1.45;
  }

  .auth-screen{
    min-height:100vh;display:grid;place-items:center;padding:24px;
    background:linear-gradient(135deg,#eef2f7 0%,#dbe4f0 100%);
  }
  .auth-card{
    width:min(430px,100%);background:#fff;border:1px solid var(--border);
    border-radius:16px;padding:26px 24px;box-shadow:0 24px 70px rgba(15,23,42,.10);
  }
  .auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .auth-tabs{display:flex;gap:4px;padding:4px;background:#f4f6f9;border-radius:10px;margin-bottom:20px}
  .auth-tabs button{
    flex:1;padding:9px;border:0;background:transparent;border-radius:8px;font:inherit;
    font-weight:600;color:var(--muted);cursor:pointer;font-size:13px;transition:.15s;
  }
  .auth-tabs button.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .auth-form{display:grid;gap:13px}
  .auth-form .btn.primary{padding:11px;font-size:14px}
  .auth-error{color:var(--bad);font-size:12.5px;min-height:16px;font-weight:500}
  .auth-hint{font-size:12px;color:var(--muted);text-align:center;line-height:1.55}
  .auth-hint b{color:var(--text);background:#eef2f7;padding:1px 5px;border-radius:4px;font-family:monospace}
  .quick-admin{
    width:100%;padding:10px;border-radius:9px;border:1px dashed #cbd5e1;background:#f8fafc;
    color:var(--muted);font:inherit;font-weight:600;font-size:13px;cursor:pointer;margin-top:6px;
  }
  .quick-admin:hover{background:#eef2f7;color:var(--text);border-color:var(--accent)}
  .debug-box{
    margin-top:14px;padding:10px 12px;border-radius:8px;font-size:12px;
    background:#fef3c7;color:#92400e;border:1px solid #fcd34d;
  }
  .debug-box b{color:#78350f}

  .topbar{
    display:flex;justify-content:space-between;align-items:center;gap:16px;
    padding:12px 24px;background:#fff;border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:30;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .logo{
    width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
    background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;font-weight:800;font-size:18px;
  }
  .brand-title{font-weight:700;font-size:16px;letter-spacing:-.01em}
  .brand-sub{font-size:11px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
  .user-chip{
    display:flex;align-items:center;gap:12px;padding:6px 8px 6px 14px;
    background:#f4f6f9;border-radius:10px;
  }
  .user-chip .user-name{font-weight:700;font-size:13px;line-height:1.2}
  .user-chip .user-role{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}

  .tabs{
    display:flex;gap:4px;overflow-x:auto;padding:10px 24px;background:#fff;
    border-bottom:1px solid var(--border);position:sticky;top:63px;z-index:25;
    scrollbar-width:thin;
  }
  .tabs button{
    border:0;background:transparent;padding:8px 14px;border-radius:8px;cursor:pointer;
    color:var(--muted);font-weight:600;white-space:nowrap;font-size:13px;font-family:inherit;
    transition:.15s;
  }
  .tabs button:hover:not(.active){background:#eef2f7;color:var(--text)}
  .tabs button.active{background:var(--accent);color:#fff}

  main{padding:22px 24px 70px;max-width:1440px;margin:0 auto}
  .head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 16px;flex-wrap:wrap}
  .head h2{margin:0;font-size:19px;letter-spacing:-.02em}
  h3{font-size:15px;margin:26px 0 12px}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px;margin-bottom:22px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px}
  .card .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
  .card .v{font-size:21px;font-weight:800;margin-top:7px;letter-spacing:-.02em}
  .card .v.green{color:var(--ok)} .card .v.red{color:var(--bad)} .card .v.blue{color:var(--accent)}
  .card .s{font-size:12px;color:var(--muted);margin-top:4px}

  .table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{
    text-align:left;padding:11px 14px;background:#fafbfd;color:var(--muted);
    font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;
    border-bottom:1px solid var(--border);white-space:nowrap;
  }
  td{padding:11px 14px;border-bottom:1px solid #f0f2f6;vertical-align:top}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#fafcff}
  .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .empty{color:var(--muted);padding:22px;text-align:center;background:var(--card);border:1px dashed var(--border);border-radius:var(--radius)}
  .row-actions{display:flex;gap:6px;justify-content:flex-end}

  .btn{
    border:1px solid var(--border);background:#fff;color:var(--text);font-family:inherit;
    padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;transition:.15s;
  }
  .btn:hover{background:#f3f6fb;border-color:#cfd6e2}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#1d4ed8}
  .btn.ghost{background:transparent;color:var(--muted)}
  .btn.danger{color:var(--bad)}
  .btn.danger:hover{background:#fdecec;border-color:#f5c2c2}
  .btn.xs{padding:4px 9px;font-size:12px;border-radius:7px;line-height:1.3}

  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
  .b-new{background:#eef2f7;color:#475569}
  .b-work{background:#fff4e0;color:#b45309}
  .b-done{background:#e7f7ee;color:#15803d}
  .b-cancel{background:#fdecec;color:#b91c1c}
  .b-role{background:var(--accent-soft);color:#1e40af}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
  .panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid #f0f2f6;margin-bottom:12px}
  .money{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
  .money b{color:var(--text);font-size:13.5px}
  .profit b{color:var(--ok)}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:900px){.two-col{grid-template-columns:1fr}}
  .sub-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:8px}
  .mini{font-size:12.5px}
  .mini td{padding:7px 8px}
  .mini th{padding:7px 8px;font-size:10px}

  select.role-select{
    padding:6px 10px;border:1px solid var(--border);border-radius:8px;font:inherit;
    font-size:13px;background:#fff;min-width:170px;
  }
  select.role-select:disabled{background:#f4f6f9;color:var(--muted);cursor:not-allowed}

  dialog{border:0;border-radius:14px;padding:0;width:min(540px,93vw);box-shadow:0 24px 70px rgba(15,23,42,.28);font-family:inherit;color:var(--text)}
  dialog::backdrop{background:rgba(15,23,42,.45)}
  .dlg-head{padding:16px 20px;border-bottom:1px solid var(--border);font-weight:700;font-size:16px}
  .dlg-body{padding:16px 20px;display:grid;gap:13px;max-height:66vh;overflow:auto}
  .dlg-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;background:#fafbfd}
  label.fld{display:grid;gap:6px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  label.fld input,label.fld select,label.fld textarea{
    padding:9px 11px;border:1px solid var(--border);border-radius:9px;font:inherit;font-size:14px;
    color:var(--text);background:#fff;font-weight:400;text-transform:none;letter-spacing:normal;width:100%;
  }
  label.fld input:focus,label.fld select:focus,label.fld textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .checks{display:flex;flex-wrap:wrap;gap:8px}
  .chk{display:flex;align-items:center;gap:6px;background:#f7f9fc;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:500;color:var(--text);cursor:pointer;text-transform:none;letter-spacing:normal}
  .chk input{width:auto}
  .period{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
  .period label{display:grid;gap:5px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .period input{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font:inherit}
  .total-row td{font-weight:800;background:#fafbfd;border-top:2px solid var(--border)}

  [hidden]{display:none !important}
</style>
</head>
<body>

<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo">С</div>
      <div>
        <div class="brand-title">СтройГрупп</div>
        <div class="brand-sub">навесы · беседки · дома</div>
      </div>
    </div>

    <div class="auth-tabs">
      <button type="button" id="tabLogin" class="active">Вход</button>
      <button type="button" id="tabRegister">Регистрация</button>
    </div>

    <form id="loginForm" class="auth-form" autocomplete="off" novalidate>
      <label class="fld">Телефон
        <input type="tel" id="loginPhone" placeholder="+7 900 000-00-00" value="+7 900 000-00-00">
      </label>
      <label class="fld">Пароль
        <input type="password" id="loginPass" value="admin">
      </label>
      <div id="loginError" class="auth-error"></div>
      <button type="submit" class="btn primary">Войти</button>
      <button type="button" class="quick-admin" id="quickAdminBtn">🔑 Быстрый вход как администратор</button>
      <div class="auth-hint">
        Администратор: <b>+7 900 000-00-00</b> / <b>admin</b>
      </div>
    </form>

    <form id="registerForm" class="auth-form" autocomplete="off" hidden novalidate>
      <label class="fld">Телефон
        <input type="tel" id="regPhone" placeholder="+7 900 123-45-67">
      </label>
      <label class="fld">ФИО
        <input type="text" id="regName" placeholder="Иванов Иван Иванович">
      </label>
      <label class="fld">Пароль (мин. 4 символа)
        <input type="password" id="regPass" placeholder="••••">
      </label>
      <label class="fld">Повтор пароля
        <input type="password" id="regPass2" placeholder="••••">
      </label>
      <div id="regError" class="auth-error"></div>
      <button type="submit" class="btn primary">Зарегистрироваться</button>
      <div class="auth-hint">
        После регистрации роль назначает администратор в разделе «Настройки».
      </div>
    </form>
  </div>
</div>

<div id="mainApp" hidden>
  <header class="topbar">
    <div class="brand">
      <div class="logo">С</div>
      <div>
        <div class="brand-title">СтройГрупп</div>
        <div class="brand-sub">навесы · беседки · мангальные зоны · дома</div>
      </div>
    </div>
    <div class="user-chip">
      <div>
        <div class="user-name" id="userName">—</div>
        <div class="user-role" id="userRole">—</div>
      </div>
      <button class="btn ghost" id="logoutBtn" title="Выйти">Выйти</button>
    </div>
  </header>

  <nav id="nav" class="tabs"></nav>
  <main id="app"></main>
</div>

<dialog id="modal">
  <div class="dlg-head" id="dlgTitle"></div>
  <div class="dlg-body" id="dlgBody"></div>
  <div class="dlg-foot">
    <button class="btn ghost" type="button" onclick="document.getElementById('modal').close()">Отмена</button>
    <button class="btn primary" type="button" id="dlgSave">Сохранить</button>
  </div>
</dialog>

<script>
/* =========================================================
   УТИЛИТЫ
   ========================================================= */
var $ = function(s, r){ return (r || document).querySelector(s); };
function uid(){ return Math.random().toString(36).slice(2, 10); }
function num(v){ var n = Number(v); return isFinite(n) ? n : 0; }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function fmt(v){ return new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 }).format(num(v)) + ' ₽'; }
function fmtN(v){ return new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 }).format(num(v)); }
function ymd(d){
  return d.getFullYear() + '-' +
         String(d.getMonth() + 1).padStart(2, '0') + '-' +
         String(d.getDate()).padStart(2, '0');
}
function today(){ return ymd(new Date()); }
function inR(d, a, b){ return !!d && d >= a && d <= b; }
function nn(v, fallback){ return (v === null || v === undefined) ? fallback : v; }
function getProp(obj, key){ return obj && obj[key]; }

function normalizePhone(s){
  var d = String(s || '').replace(/\D/g, '');
  if (d.length === 11 && (d[0] === '8' || d[0] === '7')) return '+7' + d.slice(1);
  if (d.length === 10) return '+7' + d;
  return d ? '+7' + d : '';
}
function formatPhone(s){
  var d = String(s || '').replace(/\D/g, '').slice(-10);
  if (d.length !== 10) return s || '—';
  return '+7 ' + d.slice(0,3) + ' ' + d.slice(3,6) + '-' + d.slice(6,8) + '-' + d.slice(8);
}
function hashPassword(pwd){
  var h = 0x811c9dc5;
  var s = String(pwd);
  for (var i = 0; i < s.length; i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return (h >>> 0).toString(16).padStart(8, '0');
}

/* =========================================================
   РОЛИ И ПРАВА
   ========================================================= */
var ROLES_DEF = {
  admin:      { label: 'Администратор',    tabs: 'all' },
  manager:    { label: 'Менеджер',         tabs: ['dash','objects','finance'] },
  foreman:    { label: 'Начальник цеха',   tabs: ['dash','staff','timesheet','trips','works','fleet','salary'] },
  accountant: { label: 'Бухгалтер',        tabs: ['dash','objects','finance','salary'] },
  designer:   { label: 'Проектировщик',    tabs: ['dash','objects'] },
  installer:  { label: 'Монтажник',        tabs: ['dash','trips'] },
  worker:     { label: 'Сотрудник цеха',   tabs: ['dash','timesheet','works'] }
};

/* =========================================================
   ХРАНИЛИЩЕ
   ========================================================= */
var LS_KEY = 'stroy_model_v2';
var DB = loadDB();

function safeGetItem(key){
  try { return localStorage.getItem(key); } catch (e){ console.warn('localStorage.getItem:', e); return null; }
}
function safeSetItem(key, val){
  try { localStorage.setItem(key, val); return true; }
  catch (e){
    console.error('localStorage.setItem:', e);
    if (!window.__saveWarned){
      window.__saveWarned = true;
      setTimeout(function(){
        alert('Внимание: не удалось сохранить данные в браузере.\n' +
              'Изменения будут потеряны при перезагрузке.\n\n' +
              'Причина: ' + e.message);
      }, 100);
    }
    return false;
  }
}

function loadDB(){
  var db = null;
  var raw = safeGetItem(LS_KEY);
  if (raw){
    try { db = JSON.parse(raw); }
    catch (e){ console.warn('Не удалось разобрать JSON из localStorage:', e); db = null; }
  }
  if (!db || typeof db !== 'object') db = seed();
  return migrate(db);
}

function migrate(db){
  var arrays = ['employees','vehicles','works','objects','timesheet','trips','output','costs','payments','users'];
  for (var i = 0; i < arrays.length; i++){
    if (!Array.isArray(db[arrays[i]])) db[arrays[i]] = [];
  }
  if (!db.settings || typeof db.settings !== 'object'){
    var mStart = ymd(new Date(new Date().getFullYear(), new Date().getMonth(), 1));
    db.settings = { from: mStart, to: today() };
  }
  var hasAdmin = false;
  for (var j = 0; j < db.users.length; j++){
    if (db.users[j].role === 'admin'){ hasAdmin = true; break; }
  }
  if (!hasAdmin){
    db.users.push({
      id: 'u-admin',
      phone: '+79000000000',
      name: 'Администратор',
      passHash: hashPassword('admin'),
      role: 'admin',
      createdAt: today()
    });
  }
  if (db.session === undefined) db.session = null;
  return db;
}

function save(){
  safeSetItem(LS_KEY, JSON.stringify(DB));
  if (window.__serverAuthToken){
    fetch('/api/state', {
      method: 'PUT',
      headers: { 'content-type': 'application/json', 'authorization': 'Bearer ' + window.__serverAuthToken },
      body: JSON.stringify(DB)
    }).catch(function(e){ console.warn('Серверное сохранение недоступно:', e.message); });
  }
}

function serverAuth(path, data){
  return fetch('/api/auth/' + path, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(data)
  }).then(function(response){
    return response.json().then(function(payload){
      if (!response.ok) throw new Error(payload.error || 'Ошибка авторизации');
      return payload;
    });
  });
}

function loadServerState(){
  if (!window.__serverAuthToken) return Promise.resolve(false);
  return fetch('/api/state', { headers: { authorization: 'Bearer ' + window.__serverAuthToken } })
    .then(function(response){
      if (!response.ok) throw new Error('Сессия сервера истекла');
      return response.json();
    })
    .then(function(payload){
      if (payload.db) {
        DB = migrate(payload.db);
        if (payload.user) DB.session = payload.user.id;
        safeSetItem(LS_KEY, JSON.stringify(DB));
        return true;
      }
      return false;
    });
}

function seed(){
  var d = today();
  var mStart = ymd(new Date(new Date().getFullYear(), new Date().getMonth(), 1));

  var employees = [
    { id: 'e1', name: 'Иванов И.И.',   role: 'Начальник цеха', payType: 'salary',  rate: 0,    salary: 80000, premiumPct: 0, phone: '+7 900 000-00-01' },
    { id: 'e2', name: 'Петров П.П.',   role: 'Цех',            payType: 'day',     rate: 2500, salary: 0,     premiumPct: 0, phone: '+7 900 000-00-02' },
    { id: 'e3', name: 'Сидоров С.С.',  role: 'Цех',            payType: 'piece',   rate: 0,    salary: 0,     premiumPct: 0, phone: '+7 900 000-00-03' },
    { id: 'e4', name: 'Кузнецов А.А.', role: 'Монтажник',      payType: 'day',     rate: 3000, salary: 0,     premiumPct: 0, phone: '+7 900 000-00-04' },
    { id: 'e5', name: 'Морозов Д.Д.',  role: 'Монтажник',      payType: 'day',     rate: 3000, salary: 0,     premiumPct: 0, phone: '+7 900 000-00-05' },
    { id: 'e6', name: 'Смирнов В.В.',  role: 'Менеджер',       payType: 'day',     rate: 2000, salary: 0,     premiumPct: 3, phone: '+7 900 000-00-06' },
    { id: 'e7', name: 'Орлова Е.Е.',   role: 'Бухгалтер',      payType: 'salary',  rate: 0,    salary: 60000, premiumPct: 0, phone: '+7 900 000-00-07' },
    { id: 'e8', name: 'Волков Н.Н.',   role: 'Проектировщик',  payType: 'premium', rate: 0,    salary: 0,     premiumPct: 5, phone: '+7 900 000-00-08' }
  ];
  var vehicles = [
    { id: 'v1', plate: 'А123ВС', model: 'Газель NEXT',  driverId: 'e4' },
    { id: 'v2', plate: 'В456ЕК', model: 'Ford Transit', driverId: 'e5' }
  ];
  var works = [
    { id: 'w1', name: 'Беседка — сборка',         rate: 15000 },
    { id: 'w2', name: 'Автонавес — сборка',        rate: 12000 },
    { id: 'w3', name: 'Мангальная зона — сборка',  rate: 8000 },
    { id: 'w4', name: 'Дом — каркас',              rate: 45000 }
  ];
  var objects = [
    { id: 'o1', name: 'Беседка 4×4 «Комфорт»', address: 'г. Москва, ул. Ленина, 10', phone: '+7 900 111-22-33',

/* =========================================================
   АВТОРИЗАЦИЯ
   ========================================================= */
function getCurrentUser(){
  if (!DB.session) return null;
  var u = null;
  for (var i = 0; i < DB.users.length; i++){
    if (DB.users[i].id === DB.session){ u = DB.users[i]; break; }
  }
  if (!u){ DB.session = null; save(); return null; }
  return u;
}

function canAccess(user, tabId){
  if (!user) return false;
  if (tabId === 'settings') return user.role === 'admin';
  var def = ROLES_DEF[user.role];
  if (!def) return false;
  if (def.tabs === 'all') return true;
  return def.tabs.indexOf(tabId) !== -1;
}

function initAuth(){
  try {
    if (getCurrentUser()) showMainApp();
    else showAuthScreen();
  } catch (e){
    console.error('initAuth error:', e);
    alert('Ошибка при запуске приложения:\n' + e.message);
  }
}

function showAuthScreen(){
  $('#authScreen').hidden = false;
  $('#mainApp').hidden = true;
  $('#loginError').textContent = '';
  $('#regError').textContent = '';
}

function showMainApp(){
  $('#authScreen').hidden = true;
  $('#mainApp').hidden = false;
  updateHeader();
  var user = getCurrentUser();
  if (!canAccess(user, activeTab)) activeTab = 'dash';
  renderApp();
}

function updateHeader(){
  var user = getCurrentUser();
  if (!user) return;
  $('#userName').textContent = user.name || formatPhone(user.phone);
  var roleDef = ROLES_DEF[user.role];
  $('#userRole').textContent = roleDef ? roleDef.label : user.role;
}

function switchAuthTab(which){
  var isLogin = which === 'login';
  $('#tabLogin').classList.toggle('active', isLogin);
  $('#tabRegister').classList.toggle('active', !isLogin);
  $('#loginForm').hidden = !isLogin;
  $('#registerForm').hidden = isLogin;
  $('#loginError').textContent = '';
  $('#regError').textContent = '';
}

$('#tabLogin').addEventListener('click', function(){ switchAuthTab('login'); });
$('#tabRegister').addEventListener('click', function(){ switchAuthTab('register'); });

$('#loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var err = $('#loginError');
  err.textContent = '';

  var phoneRaw = $('#loginPhone').value;
  var pass = $('#loginPass').value;
  var phone = normalizePhone(phoneRaw);

  console.log('[login] phoneRaw:', phoneRaw, '→ phone:', phone);

  if (!phoneRaw || !phone || phone.length !== 12){
    err.textContent = 'Введите корректный номер телефона';
    return;
  }
  if (!pass){ err.textContent = 'Введите пароль'; return; }

  serverAuth('login', { phone: phone, password: pass }).then(function(payload){
    window.__serverAuthToken = payload.token;
    safeSetItem('stroy_server_token', payload.token);
    return loadServerState().then(function(){ DB.session = payload.user.id; save(); showMainApp(); });
  }).catch(function(){
    var user = null;
    for (var i = 0; i < DB.users.length; i++) if (DB.users[i].phone === phone){ user = DB.users[i]; break; }
    if (!user){ err.textContent = 'Пользователь с таким телефоном не найден'; return; }
    if (user.passHash !== hashPassword(pass)){ err.textContent = 'Неверный пароль'; return; }
    DB.session = user.id; save(); showMainApp();
  });
});

$('#registerForm').addEventListener('submit', function(e){
  e.preventDefault();
  var err = $('#regError');
  err.textContent = '';

  var phoneRaw = $('#regPhone').value;
  var name = $('#regName').value.trim();
  var pass = $('#regPass').value;
  var pass2 = $('#regPass2').value;
  var phone = normalizePhone(phoneRaw);

  console.log('[register] phoneRaw:', phoneRaw, '→ phone:', phone, 'name:', name);

  if (!phone || phone.length !== 12){
    err.textContent = 'Введите корректный номер телефона';
    return;
  }
  if (!name){ err.textContent = 'Укажите ФИО'; return; }
  if (!pass || pass.length < 6){ err.textContent = 'Пароль должен содержать минимум 6 символов'; return; }
  if (pass !== pass2){ err.textContent = 'Пароли не совпадают'; return; }
  serverAuth('register', { phone: phone, name: name, password: pass }).then(function(payload){
    window.__serverAuthToken = payload.token;
    safeSetItem('stroy_server_token', payload.token);
    return loadServerState().then(function(){ DB.session = payload.user.id; save(); showMainApp(); });
  }).catch(function(){
    for (var i = 0; i < DB.users.length; i++) if (DB.users[i].phone === phone){ err.textContent = 'Пользователь с таким телефоном уже зарегистрирован'; return; }
    var user = { id: uid(), phone: phone, name: name, passHash: hashPassword(pass), role: 'worker', createdAt: today() };
    DB.users.push(user); DB.session = user.id; save(); showMainApp();
  });
});

var PAY_LABEL = { day: 'Дневная ставка', piece: 'Сдельная', salary: 'Оклад', premium: 'Только премия' };
var ROLES = ['Цех', 'Монтажник', 'Менеджер', 'Бухгалтер', 'Начальник цеха', 'Проектировщик'];
var STATUSES = ['Новый', 'В работе', 'Завершён', 'Отменён'];

function findById(arr, id){
  for (var i = 0; i < arr.length; i++){ if (arr[i].id === id) return arr[i]; }
  return null;
}
function empName(id){ var e = findById(DB.employees, id); return e ? e.name : '—'; }
function objName(id){ var o = findById(DB.objects, id); return o ? o.name : '—'; }
function vehName(id){
  var v = findById(DB.vehicles, id);
  return v ? v.plate + ' · ' + v.model : '—';
}
function tripExpense(t){
  return num(t.fuel) + num(t.materials) + num(t.other);
}
function costsFor(objectId){
  var sum = 0, i;
  for (i = 0; i < DB.costs.length; i++){
    if (DB.costs[i].objectId === objectId) sum += num(DB.costs[i].amount);
  }
  for (i = 0; i < DB.trips.length; i++){
    if (DB.trips[i].objectId === objectId) sum += tripExpense(DB.trips[i]);
  }
  return sum;
}
function paymentsFor(objectId){
  var sum = 0;
  for (var i = 0; i < DB.payments.length; i++){
    if (DB.payments[i].objectId === objectId) sum += num(DB.payments[i].amount);
  }
  return sum;
}

function daysFor(emp, from, to){
  var i, total = 0;
  if (emp.role === 'Монтажник'){
    for (i = 0; i < DB.trips.length; i++){
      var t = DB.trips[i];
      if (!inR(t.date, from, to)) continue;
      var inCrew = (t.crew || []).indexOf(emp.id) !== -1;
      if (t.seniorId === emp.id || inCrew) total += 1;
    }
    return total;
  }
  for (i = 0; i < DB.timesheet.length; i++){
    var ts = DB.timesheet[i];
    if (ts.empId === emp.id && inR(ts.date, from, to)){
      total += num(nn(ts.days, 1));
    }
  }
  return total;
}

function calcSalary(from, to){
  var result = [];
  for (var i = 0; i < DB.employees.length; i++){
    var e = DB.employees[i];
    var r = { emp: e, days: 0, base: 0, piece: 0, premium: 0, total: 0, notes: [] };
    r.days = daysFor(e, from, to);

    if (e.payType === 'day'){
      r.base = r.days * num(e.rate);
      r.notes.push(r.days + ' дн. × ' + fmtN(e.rate) + ' ₽');
    }
    if (e.payType === 'piece'){
      var pieceSum = 0;
      for (var k = 0; k < DB.output.length; k++){
        var o = DB.output[k];
        if (o.empId !== e.id) continue;
        if (!inR(o.date, from, to)) continue;
        var w = findById(DB.works, o.workId);
        if (w) pieceSum += num(w.rate) * num(o.qty);
      }
      r.piece = pieceSum;
      r.notes.push('сдельно: ' + fmt(r.piece));
    }
    if (e.payType === 'salary'){
      r.base = num(e.salary);
      r.notes.push('оклад ' + fmt(r.base));
    }

    if (num(e.premiumPct) > 0){
      var objs = [];
      for (var m = 0; m < DB.objects.length; m++){
        var obj = DB.objects[m];
        var match = false;
        if (e.role === 'Менеджер') match = (obj.managerId === e.id);
        else if (e.role === 'Проектировщик') match = (obj.designerId === e.id);
        else match = (obj.managerId === e.id || obj.designerId === e.id);
        if (match && inR(obj.closedAt, from, to)) objs.push(obj);
      }
      var sum = 0;
      for (var n = 0; n < objs.length; n++) sum += num(objs[n].amount);
      r.premium = sum * num(e.premiumPct) / 100;
      r.notes.push('премия ' + e.premiumPct + '% от ' + fmt(sum) + ' (' + objs.length + ' об.)');
    }

    r.total = r.base + r.piece + r.premium;
    result.push(r);
  }
  return result;
}

/* =========================================================
   МОДАЛЬНОЕ ОКНО
   ========================================================= */
function openForm(title, fields, data, onSave){
  var dlg = $('#modal');
  $('#dlgTitle').textContent = title;
  var body = $('#dlgBody');

  var html = '';
  for (var i = 0; i < fields.length; i++){
    var f = fields[i];
    var v = (data && data[f.key] !== undefined && data[f.key] !== null) ? data[f.key] : nn(f.def, '');

    if (f.type === 'select'){
      var opts = '';
      for (var j = 0; j < f.options.length; j++){
        var opt = f.options[j];
        var sel = String(v) === String(opt.v) ? 'selected' : '';
        opts += '<option value="' + esc(opt.v) + '" ' + sel + '>' + esc(opt.t) + '</option>';
      }
      html += '<label class="fld">' + esc(f.label) + '<select data-key="' + f.key + '">' + opts + '</select></label>';
    } else if (f.type === 'textarea'){
      html += '<label class="fld">' + esc(f.label) + '<textarea data-key="' + f.key + '" rows="3">' + esc(v) + '</textarea></label>';
    } else if (f.type === 'checks'){
      var arr = Array.isArray(v) ? v : [];
      var checksHtml = '';
      for (var c = 0; c < f.options.length; c++){
        var o = f.options[c];
        var checked = arr.indexOf(o.v) !== -1 ? 'checked' : '';
        checksHtml += '<label class="chk"><input type="checkbox" data-check="' + f.key + '" value="' + esc(o.v) + '" ' + checked + '> ' + esc(o.t) + '</label>';
      }
      html += '<div class="fld">' + esc(f.label) + '<div class="checks">' + checksHtml + '</div></div>';
    } else {
      var step = f.step ? ' step="' + f.step + '"' : '';
      html += '<label class="fld">' + esc(f.label) + '<input data-key="' + f.key + '" type="' + (f.type || 'text') + '" value="' + esc(v) + '"' + step + '></label>';
    }
  }
  body.innerHTML = html;

  $('#dlgSave').onclick = function(){
    var out = {};
    var inputs = body.querySelectorAll('[data-key]');
    for (var i = 0; i < inputs.length; i++){
      var inp = inputs[i];
      out[inp.getAttribute('data-key')] = inp.type === 'number' ? num(inp.value) : inp.value;
    }
    var checks = body.querySelectorAll('[data-check]');
    for (var c = 0; c < checks.length; c++){
      var chk = checks[c];
      var key = chk.getAttribute('data-check');
      if (!out[key]) out[key] = [];
      if (chk.checked) out[key].push(chk.value);
    }
    dlg.close();
    onSave(out);
  };

  dlg.showModal();
}

function renderDash(){
  var user = getCurrentUser();
  if (!user) return '';
  if (user.role === 'installer') return renderDashInstaller();
  if (user.role === 'worker')    return renderDashWorker();
  return renderDashFull();
}

function renderDashFull(){
  var objs = DB.objects;
  var revenue = 0, paid = 0, spent = 0, i;
  for (i = 0; i < objs.length; i++) revenue += num(objs[i].amount);
  for (i = 0; i < DB.payments.length; i++) paid += num(DB.payments[i].amount);
  for (i = 0; i < DB.costs.length; i++) spent += num(DB.costs[i].amount);
  for (i = 0; i < DB.trips.length; i++) spent += tripExpense(DB.trips[i]);
  var profit = paid - spent;
  var inWork = 0, done = 0;
  for (i = 0; i < objs.length; i++){
    if (objs[i].status === 'В работе') inWork++;
    if (objs[i].status === 'Завершён') done++;
  }

  var sal = calcSalary(DB.settings.from, DB.settings.to);
  var fot = 0;
  for (i = 0; i < sal.length; i++) fot += sal[i].total;

  var byRole = [];
  for (i = 0; i < ROLES.length; i++){
    var r = ROLES[i];
    var count = 0, sum = 0;
    for (var j = 0; j < DB.employees.length; j++) if (DB.employees[j].role === r) count++;
    for (var k = 0; k < sal.length; k++) if (sal[k].emp.role === r) sum += sal[k].total;
    if (count > 0) byRole.push({ role: r, count: count, sum: sum });
  }

  var objRows = objs.map(function(o){
    return {
      name: o.name, address: o.address, status: o.status, amount: o.amount,
      paid: paymentsFor(o.id), spent: costsFor(o.id), profit: paymentsFor(o.id) - costsFor(o.id)
    };
  });

  return '' +
  '<div class="head"><h2>Дашборд</h2></div>' +
  '<div class="cards">' +
    '<div class="card"><div class="k">Объектов</div><div class="v">' + objs.length + '</div><div class="s">в работе: ' + inWork + ' · завершено: ' + done + '</div></div>' +
    '<div class="card"><div class="k">Сумма договоров</div><div class="v blue">' + fmt(revenue) + '</div><div class="s">портфель заказов</div></div>' +
    '<div class="card"><div class="k">Поступило оплат</div><div class="v green">' + fmt(paid) + '</div><div class="s">кассовый приход</div></div>' +
    '<div class="card"><div class="k">Расходы</div><div class="v red">' + fmt(spent) + '</div><div class="s">материалы + выезды</div></div>' +
    '<div class="card"><div class="k">Прибыль (касса)</div><div class="v ' + (profit >= 0 ? 'green' : 'red') + '">' + fmt(profit) + '</div><div class="s">оплаты − расходы</div></div>' +
    '<div class="card"><div class="k">ФОТ за период</div><div class="v">' + fmt(fot) + '</div><div class="s">' + DB.settings.from + ' → ' + DB.settings.to + '</div></div>' +
    '<div class="card"><div class="k">Выездов</div><div class="v">' + DB.trips.length + '</div><div class="s">бригад монтажников</div></div>' +
  '</div>' +
  '<h3>Фонд оплаты труда по ролям</h3>' +
  table([
    { t: 'Роль', f: function(r){ return '<b>' + esc(r.role) + '</b>'; } },
    { t: 'Сотрудников', f: function(r){ return r.count; } },
    { t: 'Начислено за период', f: function(r){ return '<b>' + fmt(r.sum) + '</b>'; } }
  ], byRole) +
  '<h3>Объекты — краткая сводка</h3>' +
  table([
    { t: 'Объект', f: function(r){ return '<b>' + esc(r.name) + '</b><div class="sub">' + esc(r.address) + '</div>'; } },
    { t: 'Статус', f: function(r){ return badge(r.status); } },
    { t: 'Договор', f: function(r){ return fmt(r.amount); } },
    { t: 'Оплачено', f: function(r){ return fmt(r.paid); } },
    { t: 'Расходы', f: function(r){ return fmt(r.spent); } },
    { t: 'Прибыль', f: function(r){ return '<b style="color:' + (r.profit >= 0 ? 'var(--ok)' : 'var(--bad)') + '">' + fmt(r.profit) + '</b>'; } }
  ], objRows);
}

          { t: 'Дата', f: function(r){ return esc(r.date); } },
          { t: 'Тип', f: function(r){ return esc(r.type); } },
          { t: 'Сумма', f: function(r){ return '<b>' + fmt(r.amount) + '</b>'; } },
          { t: '', f: function(r){ return '<button class="btn xs danger" data-action="cost-del" data-id="' + r.id + '">✕</button>'; } }
        ], costs, 'Прямых расходов нет') +
        (trips.length ? '<div class="sub" style="margin-top:8px">+ расходы выездов: <b>' + fmt(tripTotal) + '</b></div>' : '') +
        '</div>' +
      '</div>' +
    '</div>';
  }
  return '<div class="head"><h2>Финансы по объектам</h2></div>' + (html || '<div class="empty">Объектов пока нет</div>');
}

function renderSalary(){
  var from = DB.settings.from;
  var to = DB.settings.to;
  var rows = calcSalary(from, to);
  var total = 0;
  for (var i = 0; i < rows.length; i++) total += rows[i].total;

  var tableRows = rows.map(function(r){
    return {
      emp: r.emp, days: r.days, base: r.base, piece: r.piece, premium: r.premium, total: r.total,
      notes: r.notes,
      payLabel: PAY_LABEL[r.emp.payType] || r.emp.payType
    };
  });

  var cols = [
    { t: 'Сотрудник', f: function(r){ return '<b>' + esc(r.emp.name) + '</b><div class="sub">' + esc(r.emp.role) + '</div>'; } },
    { t: 'Тип оплаты', f: function(r){ return esc(r.payLabel); } },
    { t: 'Дней', f: function(r){ return r.days; } },
    { t: 'База', f: function(r){ return fmt(r.base); } },
    { t: 'Сдельно', f: function(r){ return fmt(r.piece); } },
    { t: 'Премия', f: function(r){ return fmt(r.premium); } },
    { t: 'Итого', f: function(r){ return '<b>' + fmt(r.total) + '</b>'; } },
    { t: 'Расшифровка', f: function(r){ return '<span class="sub">' + esc(r.notes.join(' · ')) + '</span>'; } }
  ];

  var html = table(cols, tableRows);
  html = html.replace('</tbody>',
    '<tr class="total-row"><td colspan="6">ИТОГО ФОТ за период</td><td colspan="2">' + fmt(total) + '</td></tr></tbody>');

  return '' +
  '<div class="head"><h2>Расчёт зарплаты</h2></div>' +
  '<div class="period">' +
    '<label>Период с<input type="date" data-period="from" value="' + from + '"></label>' +
    '<label>по<input type="date" data-period="to" value="' + to + '"></label>' +
    '<div class="sub" style="margin-left:auto">Дни считаются из табеля цеха и из выездов монтажников.<br>Премия — % от суммы объектов, закрытых в периоде.</div>' +
  '</div>' +
  '<div class="cards">' +
    '<div class="card"><div class="k">ФОТ за период</div><div class="v blue">' + fmt(total) + '</div></div>' +
    '<div class="card"><div class="k">Дневные ставки</div><div class="v">' + fmt(rows.reduce(function(s, r){ return s + r.base; }, 0)) + '</div></div>' +
    '<div class="card"><div class="k">Сдельно</div><div class="v">' + fmt(rows.reduce(function(s, r){ return s + r.piece; }, 0)) + '</div></div>' +
    '<div class="card"><div class="k">Премии</div><div class="v green">' + fmt(rows.reduce(function(s, r){ return s + r.premium; }, 0)) + '</div></div>' +
  '</div>' +
  html;
}

function renderSettings(){
  var me = getCurrentUser();
  if (!me || me.role !== 'admin'){
    return '<div class="head"><h2>Настройки</h2></div><div class="empty">Раздел доступен только администратору</div>';
  }

  var rows = DB.users.map(function(u){
    return {
      id: u.id, phone: u.phone, name: u.name, role: u.role, createdAt: u.createdAt,
      isSelf: u.id === me.id
    };
  });
  var adminCount = 0;
  for (var i = 0; i < DB.users.length; i++) if (DB.users[i].role === 'admin') adminCount++;

  function roleOptionsHtml(current){
    var html = '';
    for (var key in ROLES_DEF){
      if (!ROLES_DEF.hasOwnProperty(key)) continue;
      html += '<option value="' + key + '"' + (current === key ? ' selected' : '') + '>' + ROLES_DEF[key].label + '</option>';
    }
    return html;
  }

  var rolesRightsHtml = '';
  for (var key in ROLES_DEF){
    if (!ROLES_DEF.hasOwnProperty(key)) continue;
    var def = ROLES_DEF[key];
    var tabsTitle = def.tabs === 'all' ? 'все разделы' : def.tabs.map(function(t){
      var found = null;
      for (var i = 0; i < TABS.length; i++) if (TABS[i].id === t) found = TABS[i];
      return found ? found.title : t;
    }).join(', ');
    rolesRightsHtml += '<tr><td><b>' + def.label + '</b></td><td>' + tabsTitle + '</td></tr>';
  }

  return '' +
  '<div class="head"><h2>Настройки</h2></div>' +
  '<div class="panel">' +
    '<div class="panel-head">' +
      '<div><b>Пользователи и роли</b><div class="sub">Назначайте роли зарегистрировавшимся. Роль определяет доступ к разделам.</div></div>' +
      '<div class="sub">Всего: <b>' + DB.users.length + '</b> · админов: <b>' + adminCount + '</b></div>' +
    '</div>' +
    table([
      { t: 'Телефон', f: function(r){ return '<b>' + esc(formatPhone(r.phone)) + '</b>' + (r.isSelf ? ' <span class="badge b-done">вы</span>' : ''); } },
      { t: 'Имя', f: function(r){ return esc(r.name); } },
      { t: 'Роль', f: function(r){
        return '<select class="role-select" data-role-for="' + r.id + '"' + (r.isSelf ? ' disabled' : '') + '>' + roleOptionsHtml(r.role) + '</select>';
      } },
      { t: 'Дата регистрации', f: function(r){ return esc(r.createdAt || '—'); } },
      { t: '', f: function(r){ return r.isSelf ? '' : '<div class="row-actions"><button class="btn xs danger" data-action="user-del" data-id="' + r.id + '">✕</button></div>'; } }
    ], rows) +
  '</div>' +
  '<div class="panel" style="margin-top:18px">' +
    '<b>Права по ролям</b>' +
    '<div class="sub" style="margin:6px 0 12px">К каким разделам есть доступ у каждой роли</div>' +
    '<div class="table-wrap"><table><thead><tr><th>Роль</th><th>Доступные разделы</th></tr></thead><tbody>' + rolesRightsHtml + '</tbody></table></div>' +
  '</div>' +
  '<div class="panel" style="margin-top:18px">' +
    '<b>Опасная зона</b>' +
    '<div class="sub" style="margin:6px 0 12px">Сброс всех данных к демо-набору.</div>' +
    '<button class="btn danger" data-action="reset">Сбросить демо-данные</button>' +
  '</div>';
}

/* =========================================================
   РОУТЕР
   ========================================================= */
var TABS = [
  { id: 'dash',      title: 'Дашборд',            render: renderDash },
  { id: 'objects',   title: 'Объекты',            render: renderObjects },
  { id: 'staff',     title: 'Сотрудники',         render: renderStaff },
  { id: 'timesheet', title: 'Табель цеха',        render: renderTimesheet },
  { id: 'trips',     title: 'Выезды монтажников', render: renderTrips },
  { id: 'works',     title: 'Сдельные работы',    render: renderWorks },
  { id: 'fleet',     title: 'Автопарк',           render: renderFleet },
  { id: 'finance',   title: 'Финансы',            render: renderFinance },
  { id: 'salary',    title: 'Расчёт зарплаты',    render: renderSalary },
  { id: 'settings',  title: 'Настройки',          render: renderSettings }
];

var activeTab = 'dash';

function renderApp(){
  var user = getCurrentUser();
  if (!user){ showAuthScreen(); return; }

  var visible = [];
  for (var i = 0; i < TABS.length; i++){
    if (canAccess(user, TABS[i].id)) visible.push(TABS[i]);
  }

  var navHtml = '';
  for (var j = 0; j < visible.length; j++){
    var v = visible[j];
    navHtml += '<button class="' + (v.id === activeTab ? 'active' : '') + '" data-tab="' + v.id + '">' + v.title + '</button>';
  }
  $('#nav').innerHTML = navHtml;

  var tab = null;
  for (var k = 0; k < visible.length; k++){
    if (visible[k].id === activeTab){ tab = visible[k]; break; }
  }
  if (!tab && visible.length){ tab = visible[0]; activeTab = tab.id; }

  $('#app').innerHTML = tab ? tab.render() : '<div class="empty">Нет доступных разделов</div>';
  updateHeader();
}

/* =========================================================
   СОБЫТИЯ
   ========================================================= */
$('#nav').addEventListener('click', function(e){
  var b = e.target.closest('[data-tab]');
  if (!b) return;
  activeTab = b.getAttribute('data-tab');
  renderApp();
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-action]');
  if (!b) return;
  var action = b.getAttribute('data-action');
  var fn = ACTIONS[action];
  if (fn){ e.preventDefault(); fn({ id: b.getAttribute('data-id'), obj: b.getAttribute('data-obj') }); }
});

document.addEventListener('change', function(e){
  var el = e.target;

  if (el.getAttribute('data-period')){
    DB.settings[el.getAttribute('data-period')] = el.value;
    save(); renderApp();
    return;
  }

  if (el.getAttribute('data-role-for')){
    var userId = el.getAttribute('data-role-for');
    var newRole = el.value;
    var target = findById(DB.users, userId);
    if (!target) return;

    if (target.role === 'admin' && newRole !== 'admin'){
      var adminCount = 0;
      for (var i = 0; i < DB.users.length; i++) if (DB.users[i].role === 'admin') adminCount++;
      if (adminCount <= 1){
        alert('Нельзя снять роль администратора с последнего администратора.');
        el.value = 'admin';
        return;
      }
    }
    target.role = newRole;
    save();

    el.style.transition = 'background .3s';
    el.style.background = '#e7f7ee';
    setTimeout(function(){ el.style.background = ''; }, 600);
  }
});

/* =========================================================
   ДЕЙСТВИЯ
   ========================================================= */
var ACTIONS = {
  'reset': function(){
    if (!confirm('Сбросить ВСЕ данные к демо-набору?')) return;
    DB = seed();
    DB.session = null;
    save();
    showAuthScreen();
  },

  'obj-add':  function(){ formObject(); },
  'obj-edit': function(d){ formObject(findById(DB.objects, d.id)); },
  'obj-del':  function(d){
    if (!confirm('Удалить объект?')) return;
    DB.objects = DB.objects.filter(function(x){ return x.id !== d.id; });
    save(); renderApp();
  },

  'emp-add':  function(){ formEmployee(); },
  'emp-edit': function(d){ formEmployee(findById(DB.employees, d.id)); },
  'emp-del':  function(d){
    if (!confirm('Удалить сотрудника?')) return;
    DB.employees = DB.employees.filter(function(x){ return x.id !== d.id; });
    save(); renderApp();
  },

  'ts-add':  function(){ formTimesheet(); },
  'ts-edit': function(d){ formTimesheet(findById(DB.timesheet, d.id)); },
  'ts-del':  function(d){
    if (!confirm('Удалить отметку?')) return;
    DB.timesheet = DB.timesheet.filter(function(x){ return x.id !== d.id; });
    save(); renderApp();
  },

  'trip-add':  function(){ formTrip(); },
  'trip-edit': function(d){ formTrip(findById(DB.trips, d.id)); },
  'trip-del':  function(d){
    if (!confirm('Удалить выезд?')) return;
    DB.trips = DB.trips.filter(function(x){ return x.id !== d.id; });
    save(); renderApp();
  },

  'work-add':  function(){ formWork(); },
  'work-edit': function(d){ formWork(findById(DB.works, d.id)); },
  'work-del':  function(d){
    if (!confirm('Удалить расценку?')) return;
    DB.works = DB.works.filter(function(x){ return x.id !== d.id; });
    save(); renderApp();
  },

  'out-add':  function(){ formOutput(); },
  'out-edit': function(d){ formOutput(findById(DB.output, d.id)); },
  'out-del':  function(d){
    if (!confirm('Удалить выработку?')) return;
    DB.output = DB.output.filter(function(x){ return x.id !== d.id; });
    save(); renderApp();
  },

  'veh-add':  function(){ formVehicle(); },
  'veh-edit': function(d){ formVehicle(findById(DB.vehicles, d.id)); },
  'veh-del':  function(d){
    if (!confirm('Удалить машину?')) return;
    DB.vehicles = DB.vehicles.filter(function(x){ return x.id !== d.id; });
    save(); renderApp();
  },

  'cost-add':  function(d){ formCost(null, d.obj); },
  'cost-del':  function(d){
    if (!confirm('Удалить расход?')) return;
    DB.costs = DB.costs.filter(function(x){ return x.id !== d.id; });
    save(); renderApp();
  },

  'pay-add':   function(d){ formPayment(null, d.obj); },
  'pay-del':   function(d){
    if (!confirm('Удалить оплату?')) return;
    DB.payments = DB.payments.filter(function(x){ return x.id !== d.id; });
    save(); renderApp();
  },

  'user-del': function(d){
    var me = getCurrentUser();
    if (!me || me.role !== 'admin') return;
    if (d.id === me.id){ alert('Нельзя удалить собственную запись.'); return; }
    var target = findById(DB.users, d.id);
    if (!target) return;
    var adminCount = 0;
    for (var i = 0; i < DB.users.length; i++) if (DB.users[i].role === 'admin') adminCount++;
    if (target.role === 'admin' && adminCount <= 1){ alert('Нельзя удалить последнего администратора.'); return; }
    if (!confirm('Удалить пользователя «' + target.name + '» (' + formatPhone(target.phone) + ')?')) return;
    DB.users = DB.users.filter(function(u){ return u.id !== d.id; });
    save(); renderApp();
  }
};

/* =========================================================
   СТАРТ
   ========================================================= */
try {
  window.__serverAuthToken = safeGetItem('stroy_server_token') || '';
  loadServerState().catch(function(){ return false; }).then(function(){
    initAuth();
    console.log('[СтройГрупп] Приложение запущено. Пользователей:', DB.users.length);
  });
} catch (e){
  console.error('Ошибка запуска:', e);
  alert('Ошибка при запуске приложения:\n' + e.message + '\n\nОткройте консоль (F12) для подробностей.');
}
</script>
