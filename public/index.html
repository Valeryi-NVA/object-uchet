<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NVA-House</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f6fb;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
    }

    main {
      width: min(90vw, 680px);
      padding: 48px 32px;
      text-align: center;
      background: #fff;
      border: 1px solid #dfe6f0;
      border-radius: 20px;
      box-shadow: 0 16px 48px rgb(23 32 51 / 10%);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.5rem);
    }

    p {
      margin: 20px 0 0;
      color: #52617a;
      font-size: clamp(1.1rem, 3vw, 1.4rem);
    }
  </style>
</head>
<body>
  <main>
    <h1>Привет</h1>
    <p>Добро пожаловать на работу в NVA-House</p>
  </main>
</body>
</html>
